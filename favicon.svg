<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Glass Tile -->
  <rect width="64" height="64" rx="14" fill="url(#gBg)"/>
  
  <!-- Subtle Border / Frame -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Corner Tech Accent Marks -->
  <path d="M 6 14 L 6 6 L 14 6" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 58 14 L 58 6 L 50 6" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 6 50 L 6 58 L 14 58" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 58 50 L 58 58 L 50 58" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized Cyberpunk 'G' Monogram (GENSHIN) -->
  <path d="M 45 19 L 24 19 C 17 19 13 23 13 29 L 13 35 C 13 41 17 45 24 45 L 41 45 C 44.5 45 47 42.5 47 39 L 47 31 L 30 31 L 30 36.5 L 41 36.5 L 41 39.5 L 24 39.5 C 20.5 39.5 19 37.5 19 34.5 L 19 29.5 C 19 26.5 20.5 24.5 24 24.5 L 45 24.5 Z" fill="url(#neonCyan)" filter="url(#glow)"/>

  <!-- Center Core Pip: Pure White UV Spark -->
  <circle cx="30" cy="22" r="1.8" fill="#FFFFFF" filter="url(#glow)"/>
</svg>